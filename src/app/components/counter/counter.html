<div class="counter-container">

  <div class="counter-card">

    <h1>Counter App</h1>

    <h2>{{ count }}</h2>

    <div class="btn-group">

      <button (click)="decrement()" class="btn btn-warning">- Decrement</button>

      <button (click)="reset()" class="btn btn-info">Reset</button>

      <button (click)="increment()" class="btn btn-danger">+ Increment</button>

    </div>

  </div>

</div>
